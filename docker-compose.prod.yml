services:
  postgres:
    image: postgres:16.4-alpine
    container_name: stock_platform_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set} -d ${DB_NAME:?DB_NAME must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock_network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: stock_platform_clickhouse_prod
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_backups:/var/lib/clickhouse/backups
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --port 9000 --user ${CLICKHOUSE_USER:-default} --password ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set} --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - stock_network
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: stock_platform_redis_prod
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock_network
    restart: unless-stopped

  market-service:
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY must be set}/market-service:${APP_VERSION:?APP_VERSION must be set}
    container_name: stock_platform_market_service_prod
    env_file: .env.production
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - LOG_LEVEL=INFO
      - MARKET_SERVICE_HEALTH_URL=http://market-service:8000/health
      - USER_SERVICE_HEALTH_URL=http://user-service:8000/health
      - ANALYSIS_SERVICE_HEALTH_URL=http://analysis-service:8000/health
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  user-service:
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY must be set}/user-service:${APP_VERSION:?APP_VERSION must be set}
    container_name: stock_platform_user_service_prod
    env_file: .env.production
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  analysis-service:
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY must be set}/analysis-service:${APP_VERSION:?APP_VERSION must be set}
    container_name: stock_platform_analysis_service_prod
    env_file: .env.production
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - LOG_LEVEL=INFO
      - MARKET_SERVICE_HEALTH_URL=http://market-service:8000/health
      - USER_SERVICE_HEALTH_URL=http://user-service:8000/health
      - ANALYSIS_SERVICE_HEALTH_URL=http://analysis-service:8000/health
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  data-crawler:
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY must be set}/data-crawler:${APP_VERSION:?APP_VERSION must be set}
    container_name: stock_platform_data_crawler_prod
    env_file: .env.production
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - DB_HOST=postgres
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  web:
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY must be set}/web:${APP_VERSION:?APP_VERSION must be set}
    container_name: stock_platform_web_prod
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      market-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stock_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: stock_platform_prometheus_prod
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
    networks:
      - stock_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: stock_platform_alertmanager_prod
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?ALERT_WEBHOOK_URL must be set}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--config.expand-env'
    networks:
      - stock_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: stock_platform_grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:?GRAFANA_PASS must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - stock_network
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_backups:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  stock_network:
    driver: bridge
