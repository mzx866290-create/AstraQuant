version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-stock_platform_test}
      POSTGRES_USER: ${TEST_DB_USER:-stocktest}
      POSTGRES_PASSWORD: ${TEST_DB_PASS:-stocktest}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${TEST_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-stocktest} -d ${TEST_DB_NAME:-stock_platform_test}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stock_test_network

  clickhouse-test:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: ${TEST_CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${TEST_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${TEST_CLICKHOUSE_PASSWORD:-}
    tmpfs:
      - /var/lib/clickhouse
    volumes:
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${TEST_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${TEST_CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --port 9000 --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - stock_test_network

  redis-test:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stock_test_network

networks:
  stock_test_network:
    driver: bridge
