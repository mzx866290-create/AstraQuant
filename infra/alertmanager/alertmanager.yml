global:
  resolve_timeout: 5m

route:
  receiver: ops-webhook
  group_by: ['alertname', 'service', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-webhook
    webhook_configs:
      # Expanded by Alertmanager with --config.expand-env; deployments provide
      # the real Feishu/DingTalk/Slack-compatible endpoint via ALERT_WEBHOOK_URL.
      - url: 'http://localhost:9/alerts'
        send_resolved: true
