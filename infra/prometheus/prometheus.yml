# Prometheus 配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'stock-platform-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 行情服务
  - job_name: 'market-service'
    static_configs:
      - targets: ['market-service:8000']
    metrics_path: '/metrics'

  # 用户服务
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8000']
    metrics_path: '/metrics'

  # 分析服务
  - job_name: 'analysis-service'
    static_configs:
      - targets: ['analysis-service:8000']
    metrics_path: '/metrics'

  # 数据采集服务
  - job_name: 'data-crawler'
    static_configs:
      - targets: ['data-crawler:8000']
    metrics_path: '/metrics'
