version: '3.8'

services:
  # ---- 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: stock_platform_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stock_platform}
      POSTGRES_USER: ${DB_USER:-stockadmin}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock_network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: stock_platform_clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks:
      - stock_network

  redis:
    image: redis:7-alpine
    container_name: stock_platform_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # ports removed to avoid Windows port conflicts (internal container networking still works)
    volumes:
      - redis_data:/data
    networks:
      - stock_network

  # ---- 后端服务 ----
  market-service:
    build:
      context: .
      dockerfile: ./backend/services/market_service/Dockerfile
    container_name: stock_platform_market_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - LOG_LEVEL=INFO
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
    networks:
      - stock_network
    restart: on-failure

  user-service:
    build:
      context: .
      dockerfile: ./backend/services/user_service/Dockerfile
    container_name: stock_platform_user_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stock_network
    restart: on-failure

  analysis-service:
    build:
      context: .
      dockerfile: ./backend/services/analysis_service/Dockerfile
    container_name: stock_platform_analysis_service
    env_file: .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - LOG_LEVEL=INFO
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
    networks:
      - stock_network
    restart: on-failure

  data-crawler:
    build:
      context: .
      dockerfile: ./backend/services/data_crawler/Dockerfile
    container_name: stock_platform_data_crawler
    env_file: .env
    environment:
      - DB_HOST=postgres
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - stock_network
    restart: on-failure

  # ---- 前端 ----
  web:
    build: ./frontend/web
    container_name: stock_platform_web
    ports:
      - "5175:80"
    depends_on:
      - market-service
      - user-service
    networks:
      - stock_network
    restart: on-failure

  # ---- 监控 ----
  prometheus:
    image: prom/prometheus:latest
    container_name: stock_platform_prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - stock_network

  grafana:
    image: grafana/grafana:latest
    container_name: stock_platform_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - stock_network
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  stock_network:
    driver: bridge
