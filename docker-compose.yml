services:
  # ---- 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: stock_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stock_platform}
      POSTGRES_USER: ${DB_USER:-stockadmin}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock_network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: stock_platform_clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --port 9000 --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - stock_network

  redis:
    image: redis:7-alpine
    container_name: stock_platform_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # ports removed to avoid Windows port conflicts (internal container networking still works)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock_network

  # ---- 后端服务 ----
  market-service:
    build:
      context: .
      dockerfile: ./backend/services/market_service/Dockerfile
    container_name: stock_platform_market_service
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - FRONTEND_DIST_DIR=/app/dist
      - FRONTEND_PORT=80
      - USER_SERVICE_URL=http://user-service:8000
      - MARKET_SERVICE_URL=http://market-service:8000
      - ANALYSIS_SERVICE_URL=http://analysis-service:8000
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - LOG_LEVEL=INFO
      - MARKET_SERVICE_HEALTH_URL=http://market-service:8000/health
      - USER_SERVICE_HEALTH_URL=http://user-service:8000/health
      - ANALYSIS_SERVICE_HEALTH_URL=http://analysis-service:8000/health
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: ./backend/services/user_service/Dockerfile
    container_name: stock_platform_user_service
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  analysis-service:
    build:
      context: .
      dockerfile: ./backend/services/analysis_service/Dockerfile
    container_name: stock_platform_analysis_service
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - LOG_LEVEL=INFO
      - MARKET_SERVICE_HEALTH_URL=http://market-service:8000/health
      - USER_SERVICE_HEALTH_URL=http://user-service:8000/health
      - ANALYSIS_SERVICE_HEALTH_URL=http://analysis-service:8000/health
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  data-crawler:
    build:
      context: .
      dockerfile: ./backend/services/data_crawler/Dockerfile
    container_name: stock_platform_data_crawler
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=postgres
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_NATIVE_PORT=9000
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock_network
    restart: unless-stopped

  # ---- 前端 ----
  web:
    build:
      context: ./frontend/web
      args:
        VITE_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    container_name: stock_platform_web
    environment:
      - TZ=Asia/Shanghai
      - FRONTEND_DIST_DIR=/app/dist
      - FRONTEND_PORT=80
      - USER_SERVICE_URL=http://user-service:8000
      - MARKET_SERVICE_URL=http://market-service:8000
      - ANALYSIS_SERVICE_URL=http://analysis-service:8000
    ports:
      - "5175:80"
    depends_on:
      market-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
    networks:
      - stock_network
    restart: unless-stopped

  # ---- 监控 ----
  prometheus:
    image: prom/prometheus:latest
    container_name: stock_platform_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - stock_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: stock_platform_alertmanager
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://host.docker.internal:9/alerts}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - stock_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: stock_platform_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:?GRAFANA_PASS must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - stock_network
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  stock_network:
    driver: bridge
